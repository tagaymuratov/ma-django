{% extends "base.html" %}
{% load static i18n %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/users.css' %}">
{% endblock extra_css %}

{% block content %}  
  <form method="post" class="login-form">
    {% csrf_token %}
    <h1>{% translate "Сброс пароля" %}</h1>
    {% for f in form %}
      <p>
        <label for="{{ f.id_for_label }}">{% translate 'Электронная почта:' %}</label>
        {{ f }}
      </p>
      <div>{{ f.errors }}</div>
    {% endfor %}
    <p><button type="submit" class="form-btn-main"§>{% translate "Отправить" %}</button></p>
  </form>
{% endblock %}
